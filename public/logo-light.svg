<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120">
  <defs>
    <!-- Bite mask for the top bun -->
    <mask id="biteMaskLight">
      <rect width="120" height="120" fill="#ffffff" />
      <circle cx="74" cy="24" r="13" fill="#000000" />
      <circle cx="83" cy="34" r="10" fill="#000000" />
    </mask>

    <linearGradient id="bunGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6A525"/>
      <stop offset="100%" stop-color="#E0921A"/>
    </linearGradient>
  </defs>

  <!-- ICON MARK (Dark Circle Container) -->
  <g transform="translate(10, 10)">
    <!-- Base Circle Container -->
    <circle cx="50" cy="50" r="48" fill="#0F0906" stroke="#F6A525" stroke-width="3.5"/>
    
    <!-- Stacked Burger Group -->
    <g transform="translate(0, 0)">
      <!-- Top Bun with Bite Mask -->
      <path d="M 22 44 C 22 23 35 16 50 16 C 65 16 78 23 78 44 Z" fill="url(#bunGradLight)" mask="url(#biteMaskLight)"/>

      <!-- Sesame Seeds -->
      <ellipse cx="38" cy="26" rx="2.2" ry="1.2" fill="#FFF4E0" transform="rotate(-15 38 26)"/>
      <ellipse cx="50" cy="22" rx="2.2" ry="1.2" fill="#FFF4E0"/>

      <!-- Wavy Lettuce -->
      <path d="M 20 46 C 25 50 29 46 34 50 C 39 46 44 50 49 46 C 54 50 59 46 64 50 C 69 46 74 50 80 46 L 80 49 C 74 53 69 49 64 53 C 59 49 54 53 49 49 C 44 53 39 49 34 53 C 29 49 25 53 20 49 Z" fill="#FFF4E0"/>

      <!-- Seared Patty -->
      <rect x="21" y="53" width="58" height="8" rx="4" fill="#F6A525" opacity="0.95"/>

      <!-- Dripping Cheese Melt -->
      <path d="M 22 62 L 78 62 C 78 62 74 72 68 72 C 63 72 62 66 56 66 C 52 66 50 75 44 75 C 39 75 37 68 32 68 C 27 68 24 72 22 62 Z" fill="#F6A525"/>

      <!-- Bottom Bun -->
      <path d="M 24 76 L 76 76 C 76 76 76 86 68 88 C 60 90 40 90 32 88 C 24 86 24 76 24 76 Z" fill="#FFF4E0"/>
    </g>
  </g>

  <!-- WORDMARK (Light Background Version) -->
  <g transform="translate(122, 0)">
    <!-- Unified Single Text Element for Tight Spacing -->
    <text x="0" y="68" font-family="'ChunkFiveEx', 'Alfa Slab One', 'Rockwell', 'Impact', sans-serif" font-weight="900" font-size="54" letter-spacing="-0.5px">
      <tspan fill="#0F0906">BITE </tspan>
      <tspan fill="#F6A525">THEORY</tspan>
    </text>
    
    <!-- Matching Width Underline Bar -->
    <rect x="0" y="81" width="370" height="4" fill="#0F0906" rx="2"/>
    
    <!-- Clean Tagline -->
    <text x="0" y="102" font-family="'Montserrat', sans-serif" font-weight="800" font-size="13" fill="#0F0906" letter-spacing="9" opacity="0.95">FAST FOOD</text>
  </g>
</svg>
